<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fearless Fools Football Follies</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root {
  --gold:#F4B942; --gold-dim:#c9922a; --navy:#0D1B2A; --navy-mid:#1A2E44;
  --navy-light:#243D56; --slate:#2E4A63; --green:#2ECC71; --green-dim:#27ae60;
  --red:#E74C3C; --red-dim:#c0392b; --text:#E8EDF2; --text-dim:#8AA4BE;
  --border:#2E4A63; --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
.topbar{background:var(--navy-mid);border-bottom:2px solid var(--gold);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);letter-spacing:1px}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:13px;color:var(--text-dim)}
.topbar-user span{color:var(--text);font-weight:600}
.main{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:200px;background:var(--navy-mid);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
.sidebar-section{padding:8px 16px 4px;font-size:10px;font-weight:700;color:var(--text-dim);letter-spacing:1.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text-dim);font-size:13px;font-weight:500;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--navy-light);color:var(--text)}
.nav-item.active{color:var(--gold);border-left-color:var(--gold);background:rgba(244,185,66,.07)}
.content{flex:1;padding:24px;overflow-y:auto}
.card{background:var(--navy-mid);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);margin-bottom:16px;letter-spacing:.5px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-select{width:100%;background:var(--navy);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.form-input:focus,.form-select:focus{border-color:var(--gold)}
.btn{padding:9px 18px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.btn-primary{background:var(--gold);color:var(--navy)}
.btn-primary:hover{background:var(--gold-dim)}
.btn-secondary{background:var(--slate);color:var(--text)}
.btn-secondary:hover{background:var(--navy-light)}
.btn-danger{background:var(--red);color:white}
.btn-danger:hover{background:var(--red-dim)}
.btn-success{background:var(--green);color:var(--navy)}
.btn-success:hover{background:var(--green-dim)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tag-gold{background:rgba(244,185,66,.15);color:var(--gold)}
.tag-green{background:rgba(46,204,113,.15);color:var(--green)}
.tag-red{background:rgba(231,76,60,.15);color:var(--red)}
.tag-blue{background:rgba(52,152,219,.15);color:#3498db}
.tag-gray{background:var(--navy-light);color:var(--text-dim)}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{text-align:left;padding:10px 12px;background:var(--navy);color:var(--text-dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 12px;border-bottom:1px solid rgba(46,74,99,.5);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.data-table .num{font-family:'JetBrains Mono',monospace;text-align:right}
.data-table th.num{text-align:right}
/* GAME CARD */
.game-card{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
.game-card.locked{opacity:.85}
.conf-badge{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy);font-family:'Bebas Neue',sans-serif;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conf-badge.low{background:var(--slate);color:var(--text-dim)}
.conf-select{width:62px;font-size:17px;font-family:'Bebas Neue',sans-serif;background:var(--navy);color:var(--gold);border:2px solid var(--gold);border-radius:6px;padding:5px 2px;text-align:center;cursor:pointer;outline:none;flex-shrink:0}
.conf-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:2px}
.game-matchup{flex:1;min-width:0}
.game-teams{font-weight:600;font-size:14px}
.game-pick{font-size:12px;margin-top:3px}
.game-pick.correct{color:var(--green)}
.game-pick.wrong{color:var(--red)}
.game-pick.pending{color:var(--text-dim)}
.team-btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:var(--navy-mid);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.team-btn:hover{border-color:var(--gold);color:var(--gold)}
.team-btn.selected{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.team-btn.correct{background:rgba(46,204,113,.2);border-color:var(--green);color:var(--green)}
.team-btn.wrong{background:rgba(231,76,60,.1);border-color:var(--red-dim);color:var(--red)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy)}
.login-box{width:380px;background:var(--navy-mid);border:1px solid var(--border);border-radius:12px;padding:36px}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold);text-align:center;line-height:1.1;margin-bottom:8px}
.login-sub{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:28px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--text);margin-bottom:20px;letter-spacing:.5px}
.page-title span{color:var(--gold)}
.alert{padding:12px 16px;border-radius:6px;margin-bottom:16px;font-size:13px}
.alert-info{background:rgba(52,152,219,.15);border:1px solid rgba(52,152,219,.3);color:#74b9e8}
.alert-warn{background:rgba(244,185,66,.15);border:1px solid rgba(244,185,66,.3);color:var(--gold)}
.alert-success{background:rgba(46,204,113,.15);border:1px solid rgba(46,204,113,.3);color:var(--green)}
.instructions{background:rgba(244,185,66,.06);border:1px solid rgba(244,185,66,.2);border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text-dim);line-height:1.6}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.mt-12{margin-top:12px} .mt-8{margin-top:8px} .mb-8{margin-bottom:8px}
.text-dim{color:var(--text-dim)} .text-gold{color:var(--gold)} .text-green{color:var(--green)} .text-red{color:var(--red)}
.text-sm{font-size:12px} .bold{font-weight:700} .font-mono{font-family:'JetBrains Mono',monospace}
.divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.money-pos{color:var(--green);font-family:'JetBrains Mono',monospace}
.money-neg{color:var(--red);font-family:'JetBrains Mono',monospace}
.grid-scroll{overflow-x:auto}
.full-grid{border-collapse:collapse;font-size:12px;min-width:900px}
.full-grid th,.full-grid td{border:1px solid var(--border);padding:7px 10px;text-align:center;white-space:nowrap}
.full-grid th{background:var(--navy);color:var(--text-dim);font-size:10px;text-transform:uppercase;font-weight:700}
.full-grid td.player-name{text-align:left;font-weight:600;color:var(--text);background:var(--navy-mid);position:sticky;left:0;z-index:1}
.full-grid td.total-col{font-family:'JetBrains Mono',monospace;font-weight:700;background:rgba(244,185,66,.08);color:var(--gold)}
.full-grid .pick-cell{font-family:'JetBrains Mono',monospace}
.full-grid .pick-cell.correct{background:rgba(46,204,113,.15);color:var(--green)}
.full-grid .pick-cell.wrong{background:rgba(231,76,60,.1);color:var(--red)}
.full-grid .winner-row td{background:var(--navy);font-size:10px;color:var(--text-dim);border-top:2px solid var(--gold)}
.full-grid .winner-row td.won{color:var(--green);font-weight:700}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
select option{background:var(--navy-mid)}
@media(max-width:700px){.two-col{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===================== DB =====================
const DB = {
  get(k,def){try{const v=localStorage.getItem('fools_'+k);return v?JSON.parse(v):def}catch{return def}},
  set(k,v){localStorage.setItem('fools_'+k,JSON.stringify(v))},
};
function initDB(){
  if(!DB.get('users',null)){
    DB.set('users',[{id:'u0',name:'Commissioner',password:'commish123',role:'commissioner'}]);
    DB.set('weeks',[]);DB.set('picks',[]);DB.set('lateFlags',{});
  }
}
function getUsers(){return DB.get('users',[])}
function getWeeks(){return DB.get('weeks',[])}
function getPicks(){return DB.get('picks',[])}
function currentUser(){return DB.get('session',null)}
function login(name,pw){const u=getUsers().find(u=>u.name===name&&u.password===pw);if(u){DB.set('session',u);return u}return null}
function logout(){DB.set('session',null);render()}
function getWeek(n){return getWeeks().find(w=>w.weekNum===n)}
function getPicksForUser(uid,wn){return getPicks().find(p=>p.userId===uid&&p.weekNum===wn)||null}
function saveUserPicks(uid,wn,picks){
  let all=getPicks();
  const idx=all.findIndex(p=>p.userId===uid&&p.weekNum===wn);
  const entry={userId:uid,weekNum:wn,picks,submitted:new Date().toISOString()};
  if(idx>=0)all[idx]=entry;else all.push(entry);
  DB.set('picks',all);
}
function getActiveWeek(){
  const weeks=getWeeks();
  return weeks.find(w=>w.status==='open')||weeks.filter(w=>w.status!=='archived').sort((a,b)=>b.weekNum-a.weekNum)[0]||null;
}

// ===================== SCORING =====================
function scoreWeek(wn){
  const week=getWeek(wn);
  if(!week||!week.winners||!Object.keys(week.winners).length)return[];
  const lateFlags=DB.get('lateFlags',{});
  return getUsers().filter(u=>u.role!=='commissioner').map(user=>{
    const entry=getPicksForUser(user.id,wn);
    if(!entry)return{userId:user.id,name:user.name,points:0,wins:0,losses:0,submitted:false,late:!!lateFlags[wn+'_'+user.id]};
    let pts=0,wins=0,losses=0;
    for(const pick of entry.picks){
      const winner=week.winners[pick.gameId];
      if(!winner)continue;
      if(pick.team===winner){pts+=pick.points;wins++}else losses++;
    }
    return{userId:user.id,name:user.name,points:pts,wins,losses,submitted:true,late:!!lateFlags[wn+'_'+user.id]};
  });
}
function calcWeeklyMoney(wn){
  const scores=scoreWeek(wn);
  if(!scores.length)return[];
  const maxPts=Math.max(...scores.map(s=>s.points));
  const winnerCount=scores.filter(s=>s.points===maxPts&&s.submitted).length;
  const pot=winnerCount>0?13/winnerCount:0;
  return scores.map(s=>{
    const isWinner=s.points===maxPts&&s.submitted;
    const burn=s.submitted?Math.min((maxPts-s.points)*0.20,7):7;
    const lateFee=s.late?1:0;
    const earn=isWinner?pot:0;
    return{...s,burn,weekFee:1,lateFee,earn,net:earn-burn-1-lateFee,isWinner};
  });
}
function calcSeasonMoney(){
  const users=getUsers().filter(u=>u.role!=='commissioner');
  const scored=getWeeks().filter(w=>w.status==='scored');
  const totals={};
  users.forEach(u=>{totals[u.id]={name:u.name,net:0,totalPoints:0,wins:0,losses:0,weeklyResults:[]}});
  for(const week of scored){
    for(const m of calcWeeklyMoney(week.weekNum)){
      if(totals[m.userId]){
        totals[m.userId].net+=m.net;
        totals[m.userId].totalPoints+=m.points;
        totals[m.userId].wins+=m.wins;
        totals[m.userId].losses+=m.losses;
        totals[m.userId].weeklyResults.push({weekNum:week.weekNum,...m});
      }
    }
  }
  return Object.values(totals);
}
function getPointsStandings(){
  return getUsers().filter(u=>u.role!=='commissioner').map(u=>{
    const scored=getWeeks().filter(w=>w.status==='scored');
    const half1=scored.filter(w=>w.weekNum<=9).reduce((s,w)=>{const r=scoreWeek(w.weekNum).find(x=>x.userId===u.id);return s+(r?r.points:0)},0);
    const half2=scored.filter(w=>w.weekNum>=10).reduce((s,w)=>{const r=scoreWeek(w.weekNum).find(x=>x.userId===u.id);return s+(r?r.points:0)},0);
    return{id:u.id,name:u.name,half1,half2,total:half1+half2};
  });
}
function fmt$(n){return(n>=0?'+':'')+n.toFixed(2)}

// ===================== ESPN =====================
async function fetchNFLGames(wn,yr=2025){
  try{
    const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${wn}&dates=${yr}`);
    const d=await r.json();
    return(d.events||[]).map(e=>{
      const comp=e.competitions[0];
      const away=comp.competitors.find(t=>t.homeAway==='away');
      const home=comp.competitors.find(t=>t.homeAway==='home');
      return{id:e.id,away:away.team.abbreviation,home:home.team.abbreviation,
             awayFull:away.team.displayName,homeFull:home.team.displayName,
             completed:comp.status?.type?.completed||false,
             awayScore:away.score,homeScore:home.score};
    });
  }catch(e){return null}
}
function placeholderGames(){
  const t=['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAC','KC','LAC','LAR','LV','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SEA','SF','TB','TEN','WAS'];
  return Array.from({length:14},(_,i)=>({id:'g'+i,away:t[i*2],home:t[i*2+1]}));
}

// ===================== RENDER ENGINE =====================
let currentPage='picks';
function render(){
  const user=currentUser();
  const app=document.getElementById('app');
  if(!user){app.innerHTML=renderLogin();bindLogin();return}
  app.innerHTML=renderShell(user);
  bindNav();
  renderPage();
}
function renderShell(user){
  const isComm=user.role==='commissioner';
  const navItems=isComm?[
    {id:'comm-week',icon:'🏈',label:'Manage Week'},
    {id:'comm-grid',icon:'📊',label:'Full Grid'},
    {id:'comm-standings',icon:'🏆',label:'Standings'},
    {id:'comm-money',icon:'💰',label:'Money Tracker'},
    {id:'comm-users',icon:'👥',label:'Manage Players'},
  ]:[
    {id:'picks',icon:'🏈',label:'Submit Picks'},
    {id:'my-history',icon:'📋',label:'My History'},
    {id:'standings',icon:'🏆',label:'Standings'},
    {id:'money',icon:'💰',label:'Money'},
    {id:'grid',icon:'📊',label:'Full Grid'},
  ];
  if(!navItems.find(n=>n.id===currentPage))currentPage=navItems[0].id;
  return`<div style="display:flex;flex-direction:column;min-height:100vh">
    <div class="topbar">
      <div class="topbar-logo">🏈 Fearless Fools Football Follies</div>
      <div class="topbar-right">
        <div class="topbar-user">Welcome, <span>${user.name}</span></div>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </div>
    <div class="main">
      <div class="sidebar">
        <div class="sidebar-section">${isComm?'Commissioner':'Player'}</div>
        ${navItems.map(n=>`<div class="nav-item ${currentPage===n.id?'active':''}" data-page="${n.id}"><span style="font-size:16px;width:18px;text-align:center">${n.icon}</span>${n.label}</div>`).join('')}
      </div>
      <div class="content" id="page-content"></div>
    </div>
  </div>`;
}
function bindNav(){
  document.querySelectorAll('.nav-item[data-page]').forEach(el=>{
    el.addEventListener('click',()=>{currentPage=el.dataset.page;render()});
  });
}
function renderPage(){
  const pc=document.getElementById('page-content');
  if(!pc)return;
  const pages={
    'picks':renderPicksPage,'my-history':renderMyHistory,'standings':renderStandings,
    'money':renderMoneyPage,'grid':()=>renderGridPage(),'comm-week':renderCommWeek,
    'comm-grid':()=>renderGridPage(),'comm-standings':renderStandings,
    'comm-money':renderMoneyPage,'comm-users':renderCommUsers,
  };
  const fn=pages[currentPage];
  if(fn)pc.innerHTML=fn();
}

// ===================== LOGIN =====================
function renderLogin(){
  return`<div class="login-wrap"><div class="login-box">
    <div class="login-title">FEARLESS FOOLS<br>FOOTBALL FOLLIES</div>
    <div class="login-sub">2025–2026 Season</div>
    <div id="login-err" class="alert alert-warn" style="display:none"></div>
    <div class="form-group">
      <label class="form-label">Your Name</label>
      <select class="form-select" id="login-name">
        <option value="">— Select your name —</option>
        ${getUsers().map(u=>`<option value="${u.name}">${u.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="login-pass" placeholder="Enter password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doLogin()">Sign In</button>
  </div></div>`;
}
function bindLogin(){document.getElementById('login-pass')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
function doLogin(){
  const u=login(document.getElementById('login-name').value,document.getElementById('login-pass').value);
  if(u){render()}else{const e=document.getElementById('login-err');e.textContent='Incorrect name or password.';e.style.display='block'}
}

// ===================== PICKS PAGE =====================
// Persistent state for the picks page between re-renders
let PS = { weekNum:null, games:[], teamSel:{}, confVal:{} };

function renderPicksPage(){
  const user=currentUser();
  const week=getActiveWeek();
  if(!week)return`<div class="page-title">Submit <span>Picks</span></div><div class="alert alert-info">No active week yet.</div>`;
  const locked=week.status==='locked'||week.status==='scored';
  const existing=getPicksForUser(user.id,week.weekNum);

  // Re-init PS when week changes or it's empty
  if(PS.weekNum!==week.weekNum){
    PS.weekNum=week.weekNum;
    PS.games=week.games||[];
    PS.teamSel={};
    PS.confVal={};
    PS.games.forEach((g,i)=>{ PS.confVal[g.id]=16-i; });
    if(existing){
      existing.picks.forEach(p=>{ PS.teamSel[p.gameId]=p.team; PS.confVal[p.gameId]=p.points; });
    }
  }

  const lateFlags=DB.get('lateFlags',{});
  const isLate=lateFlags[week.weekNum+'_'+user.id];

  return`
    <div class="flex-between mb-8">
      <div class="page-title">Week <span>${week.weekNum}</span> Picks</div>
      <div style="display:flex;gap:8px;align-items:center">
        ${locked?'<span class="tag tag-red">LOCKED</span>':'<span class="tag tag-green">OPEN</span>'}
        ${existing?'<span class="tag tag-gold">SUBMITTED</span>':''}
        ${isLate?'<span class="tag tag-red">LATE FEE</span>':''}
      </div>
    </div>
    ${!locked?`<div class="instructions">
      <strong>How to pick:</strong> Click the team you think will win, then use the <strong>Conf</strong> dropdown to assign confidence points 1–16. Each number must be used exactly once — 16 = most confident, 1 = least confident.
    </div>`:'<div class="instructions">Picks are locked for this week.</div>'}
    <div id="picks-list">${buildGameCards(week,locked)}</div>
    ${!locked?`<div style="margin-top:16px;display:flex;gap:12px;align-items:center">
      <button class="btn btn-primary" onclick="submitPicks()">${existing?'Update Picks':'Submit Picks'}</button>
      <div id="picks-msg" class="text-sm text-dim"></div>
    </div>`:''}`;
}

function buildGameCards(week,locked){
  return PS.games.map((game,idx)=>{
    const sel=PS.teamSel[game.id]||'';
    const conf=PS.confVal[game.id]||(16-idx);
    const winner=week.winners?week.winners[game.id]:null;
    const scored=week.status==='scored'&&winner;
    const correct=scored&&sel===winner;
    const wrong=scored&&sel&&sel!==winner;

    // Build conf dropdown options 16 down to 1
    const opts=Array.from({length:16},(_,i)=>{
      const v=16-i;
      return`<option value="${v}"${conf===v?' selected':''}>${v}</option>`;
    }).join('');

    const confCtrl=locked
      ?`<div class="conf-badge${conf<=4?' low':''}">${conf}</div>`
      :`<div>
          <div class="conf-label">Conf</div>
          <select class="conf-select" onchange="setConf('${game.id}',this.value)">${opts}</select>
        </div>`;

    const awayClass=sel===game.away?(correct&&sel===game.away?'correct':wrong&&sel===game.away?'wrong':'selected'):'';
    const homeClass=sel===game.home?(correct&&sel===game.home?'correct':wrong&&sel===game.home?'wrong':'selected'):'';

    return`<div class="game-card${locked?' locked':''}">
      ${confCtrl}
      <div class="game-matchup">
        <div class="game-teams">${game.away} @ ${game.home}</div>
        ${scored
          ?`<div class="game-pick ${correct?'correct':wrong?'wrong':'pending'}">${correct?'✓ '+sel+' (+'+conf+' pts)':wrong?'✗ '+sel+' (winner: '+winner+')':'— (winner: '+winner+')'}</div>`
          :sel?`<div class="game-pick pending">Pick: ${sel}</div>`
              :`<div class="game-pick pending text-dim">No team selected</div>`}
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button class="team-btn ${awayClass}"${locked?' disabled':''} onclick="pickTeam('${game.id}','${game.away}')">${game.away}</button>
        <button class="team-btn ${homeClass}"${locked?' disabled':''} onclick="pickTeam('${game.id}','${game.home}')">${game.home}</button>
      </div>
    </div>`;
  }).join('');
}

function pickTeam(gameId,team){
  PS.teamSel[gameId]=team;
  const week=getActiveWeek();
  document.getElementById('picks-list').innerHTML=buildGameCards(week,false);
}
function setConf(gameId,val){
  PS.confVal[gameId]=parseInt(val);
}
function submitPicks(){
  const week=getActiveWeek();
  const unsel=PS.games.filter(g=>!PS.teamSel[g.id]);
  if(unsel.length){document.getElementById('picks-msg').innerHTML='<span class="text-red">⚠ Pick a team for every game first.</span>';return}
  const vals=PS.games.map(g=>PS.confVal[g.id]||1);
  if(new Set(vals).size!==vals.length){document.getElementById('picks-msg').innerHTML='<span class="text-red">⚠ Confidence values must all be unique (1–16).</span>';return}
  const picks=PS.games.map(g=>({gameId:g.id,team:PS.teamSel[g.id],points:PS.confVal[g.id]||1}));
  saveUserPicks(currentUser().id,week.weekNum,picks);

}

async function doFetchWeek(){
  const wn=parseInt(document.getElementById('nw-num').value);
  const yr=parseInt(document.getElementById('nw-year').value);
  const status=document.getElementById('fetch-status');
  const btn=document.getElementById('fetch-btn');
  btn.disabled=true;
  status.innerHTML='<span class="spin">⟳</span> Fetching from ESPN...';
  let games=await fetchNFLGames(wn,yr);
  if(!games||!games.length){status.innerHTML='⚠ ESPN fetch failed — using placeholder games.';games=placeholderGames()}
  else status.innerHTML=`✓ Got ${games.length} games for Week ${wn}.`;
  const weeks=getWeeks();
  const idx=weeks.findIndex(w=>w.weekNum===wn);
  const entry={weekNum:wn,games,status:'open',winners:{}};
  if(idx>=0)weeks[idx]=entry;else weeks.push(entry);
  DB.set('weeks',weeks);
  PS={weekNum:null,games:[],teamSel:{},confVal:{}};
  btn.disabled=false;
  setTimeout(render,600);
}

function setWinner(wn,gameId,team){
  const weeks=getWeeks();
  const w=weeks.find(w=>w.weekNum===wn);
  if(!w)return;
  if(!w.winners)w.winners={};
  w.winners[gameId]=team;
  DB.set('weeks',weeks);
  const el=document.getElementById('winner-entry');
  if(el)el.innerHTML=buildWinnerEntry(w);
}

function lockWeek(wn){const weeks=getWeeks();const w=weeks.find(w=>w.weekNum===wn);if(w){w.status='locked';DB.set('weeks',weeks);render()}}
function unlockWeek(wn){const weeks=getWeeks();const w=weeks.find(w=>w.weekNum===wn);if(w){w.status='open';DB.set('weeks',weeks);render()}}
function scoreWeekFinal(wn){
  const weeks=getWeeks();const w=weeks.find(w=>w.weekNum===wn);
  const unscoredCount=(w.games||[]).filter(g=>!w.winners?.[g.id]).length;
  if(unscoredCount>0&&!confirm(unscoredCount+' games have no winner. Score anyway?'))return;
  w.status='scored';DB.set('weeks',weeks);
  alert('Week '+wn+' scored! Results are now live.');render();
}
function toggleLate(wn,uid){
  const lf=DB.get('lateFlags',{});const key=wn+'_'+uid;lf[key]=!lf[key];DB.set('lateFlags',lf);render();
}

function epPick(gameId,chosen,other){

function saveEP(wn,uid){
  const week=getWeek(wn);const games=week?.games||[];
  const picks=games.map(g=>({gameId:g.id,team:epSel[g.id]||'',points:parseInt(document.getElementById('ep-pts-'+g.id)?.value||1)}));
  const pts=picks.map(p=>p.points);
  if(new Set(pts).size!==pts.length){document.getElementById('ep-msg').innerHTML='<span class="text-red">⚠ Confidence values must be unique.</span>';return}
  if(picks.some(p=>!p.team)){document.getElementById('ep-msg').innerHTML='<span class="text-red">⚠ All games need a pick.</span>';return}
  saveUserPicks(uid,wn,picks);
  document.getElementById('ep-msg').innerHTML='<span class="text-green">✓ Saved!</span>';
  setTimeout(()=>{const el=document.getElementById('ep-msg');if(el)el.innerHTML=''},2000);
}

function addUser(){
  const name=document.getElementById('nu-name').value.trim();
  const pass=document.getElementById('nu-pass').value.trim();
  const msg=document.getElementById('add-msg');
  if(!name||!pass){msg.innerHTML='<span class="text-red">Name and password required.</span>';return}
  const users=getUsers();
  if(users.find(u=>u.name===name)){msg.innerHTML='<span class="text-red">Name already taken.</span>';return}
  users.push({id:'u'+Date.now(),name,password:pass,role:'player'});
  DB.set('users',users);
  msg.innerHTML=`<span class="text-green">✓ ${name} added!</span>`;
  setTimeout(render,600);
}
function removeUser(id){
  if(!confirm('Remove this player?'))return;
  DB.set('users',getUsers().filter(u=>u.id!==id));render();
}

// ===================== BOOT =====================
initDB();
render();
</script>
